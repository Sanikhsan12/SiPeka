name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - master

env:
  REGISTRY_NAME: myacr.azurecr.io
  BACKEND_IMAGE_NAME: sipeka-backend
  FRONTEND_IMAGE_NAME: sipeka-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} ./backend
          docker push ${{ env.REGISTRY_NAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and Push Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t ${{ env.REGISTRY_NAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} ./frontend
          docker push ${{ env.REGISTRY_NAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.REGISTRY_NAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          containerAppName: sipeka-backend-app
          resourceGroup: my-resource-group

      - name: Deploy Frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ env.REGISTRY_NAME }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          containerAppName: sipeka-frontend-app
          resourceGroup: my-resource-group
